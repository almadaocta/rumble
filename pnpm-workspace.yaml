packages:
  - 'apps/*'

# assistant-ui pins its own Radix versions alongside the radix-ui umbrella it
# also depends on, so the same primitives shipped two or three times in one
# bundle. These force a single copy each. All are same-major, so the APIs match.
#
# Note: pnpm 11 reads overrides from here, not from package.json's "pnpm" field.
overrides:
  '@radix-ui/react-tooltip': '1.2.14'
  '@radix-ui/react-tabs': '1.1.19'
  '@radix-ui/react-slot': '1.2.4'
allowBuilds:
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true
minimumReleaseAgeExclude:
  - '@radix-ui/react-collection@1.1.15'
  - '@radix-ui/react-compose-refs@1.1.5'
  - '@radix-ui/react-context@1.2.2'
  - '@radix-ui/react-direction@1.1.4'
  - '@radix-ui/react-id@1.1.4'
  - '@radix-ui/react-presence@1.1.10'
  - '@radix-ui/react-primitive@2.1.10'
  - '@radix-ui/react-roving-focus@1.1.19'
  - '@radix-ui/react-slot@1.3.3'
  - '@radix-ui/react-tabs@1.1.21'
  - '@radix-ui/react-use-callback-ref@1.1.4'
  - '@radix-ui/react-use-controllable-state@1.2.6'
  - '@radix-ui/react-use-effect-event@0.0.5'
  - '@radix-ui/react-use-is-hydrated@0.1.3'
  - '@radix-ui/react-use-layout-effect@1.1.4'
  - '@radix-ui/react-arrow@1.1.15'
  - '@radix-ui/react-dismissable-layer@1.1.19'
  - '@radix-ui/react-popper@1.3.7'
  - '@radix-ui/react-portal@1.1.17'
  - '@radix-ui/react-tooltip@1.2.16'
  - '@radix-ui/react-use-rect@1.1.4'
  - '@radix-ui/react-use-size@1.1.4'
  - '@radix-ui/react-visually-hidden@1.2.11'
